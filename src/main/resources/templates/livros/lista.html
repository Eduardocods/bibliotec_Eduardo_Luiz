
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros | BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Livros da biblioteca</h1>

<p class="barra">
    <a class="botao" th:href="@{/livros/novo}">Novo livro</a>
    <a class="botao botao-secundario" th:href="@{/categorias}">
        Categorias
    </a>
</p>

<p class="mensagem" th:if="${mensagem}"
   th:text="${mensagem}">Mensagem</p>

<form class="busca" method="get" th:action="@{/livros}">
    <input type="text" name="titulo"
           placeholder="Buscar por título..."
           th:value="${titulo}">

    <button type="submit" class="botao">Buscar</button>

    <a class="botao botao-secundario"
       th:href="@{/livros}">Limpar</a>
</form>

<p class="vazio" th:if="${#lists.isEmpty(livros)}">
    Nenhum livro encontrado.
</p>

<table>
    <caption>Livros cadastrados no BiblioTec</caption>

    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Categoria</th>
        <th>Disponíveis</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.id}">1</td>
        <td th:text="${livro.titulo}">Título</td>
        <td th:text="${livro.autor}">Autor</td>
        <td th:text="${livro.isbn}">9780000000000</td>
        <td th:text="${livro.categoria.nome}">Categoria</td>

        <td th:text="|${livro.quantidadeDisponivel} de ${livro.quantidadeTotal}|">
            3 de 3
        </td>

        <td>
            <a th:href="@{/livros/{id}/editar(id=${livro.id})}">
                Editar
            </a>

            <form th:action="@{/livros/{id}/excluir(id=${livro.id})}"
                  method="post"
                  style="display:inline"
                  onsubmit="return confirm('Deseja excluir este livro?')">

                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
